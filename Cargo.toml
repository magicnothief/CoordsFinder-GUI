[workspace]
members = ["coordsfinder", "coordsfinder-gui"]
resolver = "3"

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
coordsfinder = { path = "coordsfinder" }
bytemuck = { version = "1.23", features = ["derive"] }

[profile.release]
opt-level = 3
